name: Terraform Module Tests

on:
  pull_request:
    paths:
      - "modules/**"
      - "terraform/**"
      - ".github/workflows/terraform-tests.yaml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: terraform-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.7.0"
  AWS_REGION: "eu-west-2"
  TF_IN_AUTOMATION: "true"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      s3_changed: ${{ steps.filter.outputs.s3 }}
      rds_changed: ${{ steps.filter.outputs.rds }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for module changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            module1:
              - 'modules/module1/**'
            module2:
              - 'modules/module2/**'

  test-modules:
    name: Test ${{ matrix.module }} module
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: module1
            workdir: modules/module1
            changed_flag: module1_changed
            emoji: "🧪"
          - module: module2
            workdir: modules/module2
            changed_flag: module2_changed
            emoji: "🗄️"

    defaults:
      run:
        working-directory: ${{ matrix.workdir }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Decide whether to run
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="${{ needs.detect-changes.outputs[matrix.changed_flag] }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$CHANGED" == "true" ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform Format Check
        id: fmt
        if: steps.gate.outputs.run_tests == 'true'
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Comment Format Issues (sticky)
        if: steps.gate.outputs.run_tests == 'true' && steps.fmt.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = `<!-- tf-tests-${{ matrix.module }}-fmt -->`;
            const body = `${marker}
            ## ⚠️ ${{ matrix.module }} terraform fmt check failed

            Please run:
            \`\`\`
            terraform fmt -recursive
            \`\`\`
            in \`${{ matrix.workdir }}\` and commit the changes.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on Format Issues
        if: steps.gate.outputs.run_tests == 'true' && steps.fmt.outcome == 'failure'
        run: exit 1

      - name: Terraform Init
        if: steps.gate.outputs.run_tests == 'true'
        run: terraform init -backend=false

      - name: Terraform Validate
        if: steps.gate.outputs.run_tests == 'true'
        run: terraform validate -no-color

      - name: Block apply-based tests
        if: steps.gate.outputs.run_tests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include="*.tftest.hcl" 'command *= *apply' tests/; then
            echo "::error::Apply-based Terraform tests are not allowed in CI."
            exit 1
          fi

      - name: Run Terraform Tests
        id: test
        if: steps.gate.outputs.run_tests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Running ${{ matrix.module }} module tests..."
          terraform test -no-color -verbose 2>&1 | tee test-results.log

          # Strip any ANSI escape sequences defensively (fixes gibberish in summaries/comments)
          sed -r 's/\x1B\[[0-9;]*[mK]//g' test-results.log > test-results.clean.log

      - name: Record Module Status
        if: always()
        shell: bash
        run: |
          mkdir -p ../status
          STATUS="skipped"

          if [[ "${{ steps.gate.outputs.run_tests }}" == "true" ]]; then
            if [[ "${{ steps.test.outcome }}" == "success" ]]; then
              STATUS="success"
            else
              STATUS="failure"
            fi
          fi

          echo "{\"module\":\"${{ matrix.module }}\",\"status\":\"$STATUS\"}" > ../status/${{ matrix.module }}.json

      - name: Upload Module Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-status-${{ matrix.module }}
          path: modules/status/${{ matrix.module }}.json
          retention-days: 1
          
      - name: Write Job Summary
        if: always() && steps.gate.outputs.run_tests == 'true'
        shell: bash
        run: |
          echo "## ${{ matrix.emoji }} ${{ matrix.module }} Module Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f test-results.clean.log ]]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -50 test-results.clean.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No test log found._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Test Artifacts
        if: always() && steps.gate.outputs.run_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-test-results
          path: |
            ${{ matrix.workdir }}/test-results.log
            ${{ matrix.workdir }}/test-results.clean.log
          retention-days: 30
          if-no-files-found: warn

      - name: Comment PR with Results (sticky)
        if: github.event_name == 'pull_request' && always() && steps.gate.outputs.run_tests == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- tf-tests-${{ matrix.module }}-results -->`;
            const path = `${{ matrix.workdir }}/test-results.clean.log`;

            if (!fs.existsSync(path)) {
              console.log('No clean test log found; skipping comment');
              return;
            }

            const text = fs.readFileSync(path, 'utf8');
            const passed = text.includes('Success!');
            const icon = passed ? '✅' : '❌';

            const body = `${marker}
            ## ${icon} ${{ matrix.module }} Module Test Results

            <details>
            <summary>📋 Test Output (tail)</summary>

            \`\`\`
            ${text.slice(-6000)}
            \`\`\`

            </details>

            - **Status**: ${passed ? "success" : "failure"}
            - **Terraform Version**: ${{ env.TF_VERSION }}
            - **Module Path**: \`${{ matrix.workdir }}\`
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Mark Skipped (no changes)
        if: steps.gate.outputs.run_tests == 'false'
        run: |
          echo "No relevant changes for ${{ matrix.module }} (skipping)."
          echo "## ⏭️ ${{ matrix.module }} Module Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "_No changes detected in \`${{ matrix.workdir }}\`._" >> "$GITHUB_STEP_SUMMARY"

  test-summary:
   name: Test Summary & Quality Gate
   needs: [test-modules]
   if: always()
   runs-on: ubuntu-latest

   steps:
      - name: Download Status Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: module-status-*
          merge-multiple: true
          path: status

      - name: Generate Summary
        id: summary
        shell: bash
        run: |
          echo "# 🎯 Terraform Module Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Module | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|--------|" >> "$GITHUB_STEP_SUMMARY"

          OVERALL="success"

          for file in status/*.json; do
            module=$(jq -r '.module' "$file")
            status=$(jq -r '.status' "$file")

            case "$status" in
              success) icon="✅ success" ;;
              failure) icon="❌ failure"; OVERALL="failure" ;;
              skipped) icon="⏭️ skipped" ;;
              *) icon="❓ unknown"; OVERALL="failure" ;;
            esac

            echo "| $module | $icon |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$OVERALL" == "failure" ]]; then
            echo "## ⛔ Quality Gate: FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "One or more module test suites failed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ Quality Gate: PASSED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "All required module tests passed successfully." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "overall=$OVERALL" >> "$GITHUB_OUTPUT"

      - name: Sticky PR Summary Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tf-tests-overall-summary -->';

            const summary = fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8');
            const overall = '${{ steps.summary.outputs.overall }}';
            const icon = overall === 'success' ? '✅' : '❌';

            const body = `${marker}
            ## ${icon} Terraform Module Test Summary

            ${summary}

            > This comment is automatically updated on each push.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
  quality-gate:
    name: Quality Gate (Required Check)
    needs: [test-summary]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Quality Gate
        run: |
          if [[ "${{ needs.test-summary.result }}" != "success" ]]; then
            echo "::error::Quality gate failed - tests did not pass"
            exit 1
          fi
          echo "::notice::✅ Quality gate passed - all tests successful"