name: Terraform PR Validation

# Lints, tests, validates and plans every deployment of the chosen environment
# against its real state on a pull request. Uses the plan role only and never
# applies.
on:
  pull_request:
    paths:
      - "source/terraform/**"

permissions:
  contents: read

jobs:
  validate:
    permissions:
      id-token: write       # OIDC role assumption for the plan role
      contents: read        # checkout
      pull-requests: read
    uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/.github/workflows/terraform-pr-validation.yml@1.3.0
    with:
      environment: dev      # whose state the PR plans against
      terraform-version: "1.17.2"
